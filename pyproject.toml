[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceiq"
version = "0.1.0"
description = "Auditable invoice-to-purchase-order automation case study"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1", "fastapi>=0.110,<1", "streamlit>=1.35,<2", "uvicorn>=0.30,<1", "langgraph>=0.3,<2", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["invoiceiq*"]
